name: LumixProbe
options:
  bundleIdPrefix: com.seichris
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  LumixProbe:
    type: application
    platform: iOS
    sources:
      - path: LumixProbe
    info:
      path: LumixProbe/Info.plist
      properties:
        CFBundleDisplayName: LumixProbe
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: LumixProbe connects directly to your Lumix camera over its local Wi-Fi network.
        NSPhotoLibraryAddUsageDescription: LumixProbe can save original photos downloaded from your Lumix camera to your photo library.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seichris.LumixProbe
        PRODUCT_NAME: LumixProbe
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
